name: One-shot context-first settings patch

on:
  push:
    branches: [ 'feat/settings-upper-region-filter' ]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: trigger context-first bridge patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-upper-region-filter
          fetch-depth: 0
      - name: Apply context-first patch
        run: python tools/apply_context_first_settings.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bridge.cpp
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No patch produced'; exit 1; } || true
          git commit -m "fix: prefer AutoFightGroup TopIcon settings context"
          git push origin HEAD:feat/settings-upper-region-filter
