name: One-shot semantic AUTO settings open patch

on:
  push:
    branches: [ 'feat/semantic-auto-settings-open' ]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: apply semantic AUTO settings open patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-auto-settings-open
          fetch-depth: 0
      - name: Apply semantic AUTO settings patch
        run: python tools/apply_semantic_auto_settings_open.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bridge.cpp src/main.cpp
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No patch produced'; exit 1; } || true
          git commit -m "feat: open AUTO settings via semantic UI objects"
          git push origin HEAD:feat/semantic-auto-settings-open
