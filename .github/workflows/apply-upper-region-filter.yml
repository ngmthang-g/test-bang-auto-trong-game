name: One-shot upper region filter patch

on:
  push:
    branches: [ 'feat/settings-upper-region-filter' ]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: apply upper region filter patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-upper-region-filter
          fetch-depth: 0
      - name: Apply upper region filter patch
        run: python tools/apply_upper_region_filter.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bridge.cpp src/main.cpp
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No patch produced'; exit 1; } || true
          git commit -m "feat: choose upper AUTO settings candidate by normalized position"
          git push origin HEAD:feat/settings-upper-region-filter
