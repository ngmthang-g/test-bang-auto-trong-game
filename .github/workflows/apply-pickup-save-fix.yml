name: One-shot pickup save proof fix

on:
  push:
    branches: [ 'feat/auto-settings-probe-v0.2' ]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: apply pickup save fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-settings-probe-v0.2
          fetch-depth: 0
      - name: Apply pickup setter + save proof patch
        run: python tools/apply_pickup_save_fix.py
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bridge.cpp CMakeLists.txt
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No patch produced'; exit 1; } || true
          git commit -m "fix: persist pickup through save settings proof"
          git push origin HEAD:feat/auto-settings-probe-v0.2
