name: Build Auto Settings Probe

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/ThanLongAutoSettingsProbe.exe artifact/
          Copy-Item build/Release/ThanLongAutoSettingsBridge.dll artifact/
          Copy-Item README.md artifact/
      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongAutoSettingsProbe-v0.1-win-x64
          path: artifact/*
          if-no-files-found: error
