name: One-shot pickup tab bridge patch

on:
  push:
    branches:
      - feat/auto-settings-probe-v0.2
    paths:
      - .github/workflows/apply-pickup-tab-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-settings-probe-v0.2
          fetch-depth: 0
      - name: Apply verified bridge patch
        run: python tools/apply_pickup_tab_patch.py
      - name: Commit bridge patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bridge.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch produced"
            exit 1
          fi
          git commit -m "feat: auto-select Nhặt đồ tab before pickup probe"
          git push origin HEAD:feat/auto-settings-probe-v0.2
